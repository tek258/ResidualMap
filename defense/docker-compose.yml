# S3-K5: WAF engelleme modu (ModSecurity + OWASP CRS, MODSEC_RULE_ENGINE=On)
# Onceki adim: DetectionOnly ile ilk calistirma. Degisiklikler ve istisnalar: docs/waf-engelleme-notu.md
# Calistirma: docker compose up -d --force-recreate waf suricata   |   Giris noktasi: http://localhost:8080
# Dogrulama:  ./test-waf.sh  &&  python3 test-juice-flows.py   (ikisi de cikis kodu 0 vermeli)
services:
  juice-shop:
    image: bkimminich/juice-shop
    container_name: juice-shop
    restart: unless-stopped
    expose:
      - "3000"          # host'a acilmaz, sadece WAF erisir
    networks: [lab]

  waf:
    # nginx + ModSecurity v3 + CRS bir arada. CRS surumu SABIT: istisnalar
    # (modsecurity/REQUEST-900-...) kural ID'lerine bagli ve CRS 4.30.0 ile test
    # edildi. Kayan "nginx" etiketi CRS'i sessizce yukseltebilir; yukseltme
    # yapilacaksa once test-waf.sh ve test-juice-flows.py ile yeniden dogrulanmali.
    image: owasp/modsecurity-crs:4.30.0-nginx-202610180210
    container_name: waf-nginx
    restart: unless-stopped
    depends_on: [juice-shop]
    ports:
      - "8080:8080"
    environment:
      BACKEND: http://juice-shop:3000
      PORT: "8080"
      PROXY: "1"
      # --- ModSecurity ---
      MODSEC_RULE_ENGINE: "On"               # ENGELLEME: anomali skoru esigi asan istek 403 alir
      MODSEC_AUDIT_ENGINE: RelevantOnly      # sadece kural tetikleyen istekler
      MODSEC_AUDIT_LOG_FORMAT: JSON
      MODSEC_AUDIT_LOG_TYPE: Serial
      MODSEC_AUDIT_LOG: /var/log/modsecurity/audit.log
      # --- CRS ---
      PARANOIA: "1"
      BLOCKING_PARANOIA: "1"
      ANOMALY_INBOUND: "5"
      ANOMALY_OUTBOUND: "4"
      ALLOWED_METHODS: "GET HEAD POST OPTIONS"   # CRS varsayilani; PUT/PATCH/DELETE sadece istisna dosyasindaki yollarda acik
      # --- nginx loglari ---
      ACCESSLOG: /var/log/nginx/access.log
      ERRORLOG: /var/log/nginx/error.log
      LOGLEVEL: warn
    volumes:
      - ./nginx/logging.conf.template:/etc/nginx/templates/conf.d/logging.conf.template:ro
      # Juice Shop yanlis pozitif istisnalari (CRS'ten once yuklenir)
      - ./modsecurity/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:/etc/modsecurity.d/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:ro
      # Sanal yamalar: CRS'in kacirdigi bilinen aciklar (SY-1 = V003)
      - ./modsecurity/REQUEST-900-VIRTUAL-PATCHES-JUICESHOP.conf:/etc/modsecurity.d/owasp-crs/rules/REQUEST-900-VIRTUAL-PATCHES-JUICESHOP.conf:ro
      - ./logs/nginx:/var/log/nginx
      - ./logs/modsecurity:/var/log/modsecurity
    networks: [lab]

  suricata:
    image: jasonish/suricata:latest
    container_name: lab-suricata
    restart: unless-stopped
    network_mode: "service:waf"
    depends_on:
      - waf
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    command: ["-i", "eth0", "-k", "none"]
    volumes:
      - ./suricata/suricata.yaml:/etc/suricata/suricata.yaml
      - ./suricata/disable.conf:/etc/suricata/disable.conf
      - ./suricata/threshold.config:/etc/suricata/threshold.config
      - ./suricata/rules/local.rules:/etc/suricata/rules/local.rules
      - ./suricata/lib:/var/lib/suricata
      - ./suricata/logs:/var/log/suricata

networks:
  lab:
