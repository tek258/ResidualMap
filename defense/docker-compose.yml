# S4-K5: Ag segmentasyonu + surum sabitleme. Ayrinti: docs/iam-segmentasyon-notu.md
# Calistirma: docker compose down && docker compose up -d   |   Giris: http://localhost:8080
# Dogrulama:  ./test-waf.sh && python3 test-juice-flows.py   (ikisi de cikis kodu 0)
services:
  juice-shop:
    # I-1 ve SY-1 bu surume bagli; yukseltmeden once testleri tekrar calistir
    image: bkimminich/juice-shop:v20.2.0@sha256:8739101ade29358abb5469ee66ae78e582c97ed0a5543a4ad102e5fa5193526b
    container_name: juice-shop
    restart: unless-stopped
    expose:
      - "3000"
    networks: [backend]

  waf:
    # CRS 4.30.0'a sabit; istisnalar kural ID'lerine bagli
    image: owasp/modsecurity-crs:4.30.0-nginx-202610180210
    container_name: waf-nginx
    restart: unless-stopped
    depends_on: [juice-shop]
    ports:
      - "8080:8080"
    environment:
      BACKEND: http://juice-shop:3000
      PORT: "8080"
      PROXY: "1"
      MODSEC_RULE_ENGINE: "On"
      MODSEC_AUDIT_ENGINE: RelevantOnly
      MODSEC_AUDIT_LOG_FORMAT: JSON
      MODSEC_AUDIT_LOG_TYPE: Serial
      MODSEC_AUDIT_LOG: /var/log/modsecurity/audit.log
      SERVER_TOKENS: "off"
      SERVER_HEADER: ""
      PARANOIA: "1"
      BLOCKING_PARANOIA: "1"
      ANOMALY_INBOUND: "${WAF_ANOMALY_INBOUND:-5}"  # yalnizca guvenlik payi denemesi icin degistirilir
      ANOMALY_OUTBOUND: "4"
      ALLOWED_METHODS: "GET HEAD POST OPTIONS"   # PUT/PATCH/DELETE yalnizca istisna dosyasindaki yollarda
      ACCESSLOG: /var/log/nginx/access.log
      ERRORLOG: /var/log/nginx/error.log
      LOGLEVEL: warn
    volumes:
      - ./nginx/logging.conf.template:/etc/nginx/templates/conf.d/logging.conf.template:ro
      # Imajin sablonu + IAM bolumu (/oauth2/, /ftp, /metrics)
      - ./nginx/default.conf.template:/etc/nginx/templates/conf.d/default.conf.template:ro
      - ./modsecurity/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:/etc/modsecurity.d/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:ro
      - ./modsecurity/REQUEST-900-VIRTUAL-PATCHES-JUICESHOP.conf:/etc/modsecurity.d/owasp-crs/rules/REQUEST-900-VIRTUAL-PATCHES-JUICESHOP.conf:ro
      - ./logs/nginx:/var/log/nginx
      - ./logs/modsecurity:/var/log/modsecurity
    networks:
      frontend:
        ipv4_address: 172.30.1.10   # istemci bacagi
      backend:
        ipv4_address: 172.30.2.10   # Juice Shop bacagi

  suricata:
    image: jasonish/suricata:8.0.8   # lab surumu (suricata -V, 18.11.2026)
    container_name: lab-suricata
    restart: unless-stopped
    network_mode: "service:waf"
    depends_on:
      - waf
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    # WAF'in iki arayuzu de dinlenir (frontend + backend)
    command: ["-i", "eth0", "-i", "eth1", "-k", "none"]
    volumes:
      - ./suricata/suricata.yaml:/etc/suricata/suricata.yaml
      - ./suricata/disable.conf:/etc/suricata/disable.conf
      - ./suricata/threshold.config:/etc/suricata/threshold.config
      - ./suricata/rules/local.rules:/etc/suricata/rules/local.rules
      - ./suricata/lib:/var/lib/suricata
      - ./suricata/logs:/var/log/suricata

  # --- IAM: Keycloak (kimlik saglayici) + oauth2-proxy (WAF'in sordugu kapi) ---
  # Sifreler ve gizli anahtarlar YALNIZCA bu izole lab icindir.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: Admin-Lab-2026!
      KC_HOSTNAME: http://localhost:8081          # tarayicinin gordugu adres = token'daki issuer
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"     # oauth2-proxy ic adresten (keycloak:8080) konusabilsin
      KC_HTTP_ENABLED: "true"
    ports:
      - "8081:8080"   # giris sayfasi ve yonetim arayuzu
    volumes:
      - ./iam/realm-lab.json:/opt/keycloak/data/import/realm-lab.json:ro
    networks: [frontend]

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
    container_name: oauth2-proxy
    restart: unless-stopped
    depends_on: [keycloak]
    command:
      - --provider=keycloak-oidc
      - --client-id=juice-ops
      - --client-secret=kRCZ1CV98Yjb3pZZKLuJJiuTfj2Mk39P   # realm-lab.json ile ayni
      - --cookie-secret=S9zgNsXu0Q3Mx0PzpIH7fhGzjfpxFPMD
      - --cookie-secure=false          # lab HTTP
      - --email-domain=*
      - --allowed-role=ops             # yalnizca ops rolu (realm rolu); digerleri 403
      - --http-address=0.0.0.0:4180
      - --reverse-proxy=true
      - --upstream=static://202        # yalnizca kimlik kontrolu yapar, trafigi nginx tasir
      - --skip-provider-button=true
      - --code-challenge-method=S256
      - --redirect-url=http://localhost:8080/oauth2/callback
      # Tarayici Keycloak'a localhost:8081'den, oauth2-proxy ise ic agdan ulasir;
      # bu yuzden otomatik kesif yerine adresler tek tek verilir.
      - --oidc-issuer-url=http://localhost:8081/realms/lab
      - --skip-oidc-discovery=true
      - --login-url=http://localhost:8081/realms/lab/protocol/openid-connect/auth
      - --redeem-url=http://keycloak:8080/realms/lab/protocol/openid-connect/token
      - --oidc-jwks-url=http://keycloak:8080/realms/lab/protocol/openid-connect/certs
      - --validate-url=http://keycloak:8080/realms/lab/protocol/openid-connect/userinfo
    expose:
      - "4180"        # host'a acilmaz, yalnizca WAF erisir
    networks: [frontend]

  # --- Merkezi log ve alarm panosu (S5-K5). Yalnizca "--profile siem" ile baslar. ---
  # Ayrinti: docs/siem-kurulum.md
  loki:
    image: grafana/loki:3.4.2
    container_name: loki
    restart: unless-stopped
    profiles: [siem]
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./siem/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki-veri:/loki
    networks: [siem]

  alloy:
    image: grafana/alloy:v1.7.1
    container_name: alloy
    restart: unless-stopped
    profiles: [siem]
    depends_on: [loki]
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data"]
    volumes:
      - ./siem/config.alloy:/etc/alloy/config.alloy:ro
      - ./logs/modsecurity:/logs/modsecurity:ro
      - ./logs/nginx:/logs/nginx:ro
      - ./suricata/logs:/logs/suricata:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro   # oauth2-proxy ve Keycloak ciktilari
      - alloy-veri:/var/lib/alloy/data
    networks: [siem]

  grafana:
    image: grafana/grafana:11.5.2
    container_name: grafana
    restart: unless-stopped
    profiles: [siem]
    depends_on: [loki]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: Admin-Lab-2026!   # yalnizca lab
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/residualmap-lab.json
    ports:
      - "3001:3000"   # pano: http://localhost:3001
    volumes:
      - ./siem/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./siem/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-veri:/var/lib/grafana
    networks: [siem]

networks:
  frontend:
    ipam:
      config:
        - subnet: 172.30.1.0/24
  backend:
    internal: true   # disariya cikis yok
    ipam:
      config:
        - subnet: 172.30.2.0/24
  siem:
    # Log toplama agi. WAF/Juice Shop aglarindan ayri; Alloy loglari dosyadan okur.

volumes:
  loki-veri:
  alloy-veri:
  grafana-veri:
