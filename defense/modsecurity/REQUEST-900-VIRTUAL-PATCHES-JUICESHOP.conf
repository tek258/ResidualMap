# =============================================================================
# S3-K5: Juice Shop icin sanal yamalar (virtual patching)
#
# Container icinde su yola baglanir:
#   /etc/modsecurity.d/owasp-crs/rules/REQUEST-900-VIRTUAL-PATCHES-JUICESHOP.conf
# Imaj rules/*.conf dosyalarini alfabetik sirayla yukler; bu dosya istisna
# dosyasindan sonra, CRS kurallarindan once calisir.
#
# Istisna dosyasindan farki: istisnalar CRS'i GEVSETIR (yanlis pozitif),
# sanal yamalar CRS'in KACIRDIGI bilinen bir aciga ozel kural EKLER.
# Her yama envanterdeki bir zafiyete (Vxxx) baglidir ve
# docs/waf-engelleme-notu.md dosyasinda belgelenmistir.
#
# Kural ID araligi: 10100-10199
# =============================================================================


# -----------------------------------------------------------------------------
# SY-1  V003: Siparis takibi, yol icinde NoSQL enjeksiyonu
#
# /rest/track-order/:id  ->  MongoDB benzeri $where sorgusuna dogrudan girer:
#   db.ordersCollection.find({ $where: `this.orderId === '${id}'` })
# "' || true || '" gibi bir deger tum kullanicilarin siparislerini dondurur.
# CRS (PL1) bu yukleri yol icinde yakalamiyor (test: 200, 3 siparis sizdi).
#
# Pozitif model: sadece Juice Shop'un urettigi siparis numarasi bicimine izin
# verilir (routes/order.ts: hash(email).slice(0,4) + '-' + randomHex(16)):
#   ^/rest/track-order/[0-9a-f]{4}-[0-9a-f]{16}$
# Express yollari buyuk/kucuk harf ayirmaz; yol once %xx cozulur, // ve ./
# normalize edilir, kucuk harfe cevrilir. Boylece /REST/Track-Order/... veya
# //rest/track-order/... ile atlatilamaz.
# -----------------------------------------------------------------------------
SecRule REQUEST_FILENAME "@rx ^/rest/track-order/" \
    "id:10100,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    auditlog,\
    t:none,t:urlDecodeUni,t:normalizePath,t:lowercase,\
    msg:'Sanal yama SY-1 (V003): gecersiz siparis numarasi bicimi',\
    logdata:'%{MATCHED_VAR}',\
    tag:'juice-shop/V003',\
    tag:'attack-injection-nosql',\
    severity:'CRITICAL',\
    chain"
    SecRule REQUEST_FILENAME "!@rx ^/rest/track-order/[0-9a-f]{4}-[0-9a-f]{16}$" \
        "t:none,t:urlDecodeUni,t:normalizePath,t:lowercase"


# -----------------------------------------------------------------------------
# SY-2  V008: Kayit isteginde rol atama (mass assignment, "Admin Registration")
#
# POST /api/Users govdesi dogrudan Sequelize User modeline yazilir; govdeye
# "role":"admin" eklenirse kullanici yonetici olarak olusur. Uygulamanin kayit
# formu bu alani hic gondermez, bu yuzden kayit isteginde "role" adinda bir
# parametre gormek her durumda saldiridir.
#
# phase:2 (govde). CRS 901 JSON govdeler icin JSON islemcisini acar; JSON
# alanlari ARGS_NAMES'te "json.role" olarak gorunur. Form govdesi ("role=")
# ve ic ice alanlar ("json.x.role") da yakalanir. Yol SY-1'deki gibi normalize
# edilir (/API/Users, //api/users/ ile atlatilamaz).
# -----------------------------------------------------------------------------
SecRule REQUEST_METHOD "@streq POST" \
    "id:10110,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    auditlog,\
    msg:'Sanal yama SY-2 (V008): kayit isteginde rol alani',\
    logdata:'%{MATCHED_VAR_NAME}',\
    tag:'juice-shop/V008',\
    tag:'attack-mass-assignment',\
    severity:'CRITICAL',\
    chain"
    SecRule REQUEST_FILENAME "@rx ^/api/users/?$" \
        "t:none,t:urlDecodeUni,t:normalizePath,t:lowercase,\
        chain"
        SecRule ARGS_NAMES "@rx (?:^|\.)role$" \
            "t:none,t:lowercase"


# -----------------------------------------------------------------------------
# SY-3  V013: Acik yonlendirme ve eskimis izin listesi ("Outdated Allowlist")
#
# /redirect?to=... hedefi lib/insecurity.ts'te url.includes(izinli) ile
# denetleniyor: izinli bir adresi ICEREN her adrese (ornegin
# https://baska.site/?x=https://github.com/juice-shop/juice-shop) yonlendirir.
# Listede arayuzde artik kullanilmayan uc kripto para adresi de duruyor
# (payment.component.html'de @if (false) ile gizli).
#
# Pozitif model: yalnizca arayuzun gercekten kullandigi bes adrese, birebir
# esitlikle izin verilir; tek bir "to" parametresi zorunlu (to=a&to=b dizisi
# Express'te farkli islenir).
# -----------------------------------------------------------------------------
SecRule REQUEST_FILENAME "@rx ^/redirect/?$" \
    "id:10120,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    auditlog,\
    t:none,t:urlDecodeUni,t:normalizePath,t:lowercase,\
    msg:'Sanal yama SY-3 (V013): yonlendirmede tek bir to parametresi olmali',\
    tag:'juice-shop/V013',\
    tag:'attack-open-redirect',\
    severity:'CRITICAL',\
    chain"
    SecRule &ARGS_GET:to "!@eq 1" "t:none"

SecRule REQUEST_FILENAME "@rx ^/redirect/?$" \
    "id:10121,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    auditlog,\
    t:none,t:urlDecodeUni,t:normalizePath,t:lowercase,\
    msg:'Sanal yama SY-3 (V013): izin listesinde olmayan yonlendirme hedefi',\
    logdata:'%{MATCHED_VAR}',\
    tag:'juice-shop/V013',\
    tag:'attack-open-redirect',\
    severity:'CRITICAL',\
    chain"
    SecRule ARGS_GET:to "!@rx ^(?:https://github\.com/juice-shop/juice-shop|http://shop\.spreadshirt\.(?:com|de)/juiceshop|https://www\.stickeryou\.com/products/owasp-juice-shop/794|http://leanpub\.com/juice-shop)$" \
        "t:none"


# -----------------------------------------------------------------------------
# SY-4  V010: XML dosya yuklemesi (XXE)
#
# routes/fileUpload.ts dosyayi YALNIZCA adi ".xml" ile bitiyorsa libxml ile
# (dis varliklar acik) isliyor; XML sikayet yuklemesi uygulamanin kendisinde de
# "kullanimdan kalkti" olarak isaretli. Arayuz yalnizca PDF ve ZIP yukler.
# Bu yuzden /file-upload'a .xml adli dosya yuklemek engellenir; icerige
# bakmaya gerek yoktur, karar dosya adina gore verilir.
# -----------------------------------------------------------------------------
SecRule REQUEST_FILENAME "@rx ^/file-upload/?$" \
    "id:10130,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    auditlog,\
    t:none,t:urlDecodeUni,t:normalizePath,t:lowercase,\
    msg:'Sanal yama SY-4 (V010): XML dosya yuklemesi',\
    logdata:'%{MATCHED_VAR}',\
    tag:'juice-shop/V010',\
    tag:'attack-xxe',\
    severity:'CRITICAL',\
    chain"
    SecRule FILES "@rx \.xml\s*$" "t:none,t:lowercase"


# -----------------------------------------------------------------------------
# SY-5  V012: Profil guncellemesinde CSRF
#
# POST /profile yalnizca oturum cerezine bakiyor (routes/updateUserProfile.ts);
# istegin hangi siteden geldigini denetlemiyor. Tarayicilar baska bir siteden
# gelen POST isteklerine her zaman Origin basligi ekler. Origin varsa ve lab'in
# kendi adreslerinden biri degilse istek engellenir ("null" da dahil).
# Origin'i olmayan istekler (tarayici disi) etkilenmez.
# -----------------------------------------------------------------------------
SecRule REQUEST_FILENAME "@rx ^/profile/?$" \
    "id:10140,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    auditlog,\
    t:none,t:urlDecodeUni,t:normalizePath,t:lowercase,\
    msg:'Sanal yama SY-5 (V012): profil guncellemesi baska bir siteden',\
    logdata:'%{MATCHED_VAR}',\
    tag:'juice-shop/V012',\
    tag:'attack-csrf',\
    severity:'CRITICAL',\
    chain"
    SecRule REQUEST_METHOD "@streq POST" "t:none,chain"
        SecRule REQUEST_HEADERS:Origin "!@rx ^https?://(?:localhost|127\.0\.0\.1|host\.docker\.internal)(?::8080)?$" \
            "t:none,t:lowercase"


# -----------------------------------------------------------------------------
# SY-6  V002: Urun aramasinda SQL enjeksiyonu (UNION SQLi, "Database Schema")
# SY-7  V001: Giris formunda SQL enjeksiyonu ("Login Admin")
#
# CRS bu iki istegi yalnizca 942100 (libinjection) ile ve puan tam esikte (5)
# yakaliyordu: esik yukseltilir ya da 942100 bu alanlardan cikarilirsa gecer.
# Bu kurallar puanlamaya katilmaz, dogrudan engeller.
#
# routes/search.ts ve routes/login.ts girdiyi SQLite'ta tek tirnakli bir
# string'in icine koyuyor (... LIKE '%${q}%', email = '${email}'). SQLite'ta
# ters egik cizgi kacis karakteri degildir; string'den cikmanin tek yolu tek
# tirnaktir. Tek tirnak bu iki alanda yasaklaninca enjeksiyon mumkun olmaz.
#   - Urun adlarinin hicbirinde tek tirnak yok (yalnizca cift tirnak var);
#     arayuz aramayi q= (bos) ile yapip sonuclari tarayicida suzuyor.
#   - Kayit akisi e-postada tek tirnak gondermiyor; seed kullanicilarinda da yok.
# JSON (' dahil) CRS 901 islemcisiyle cozulur; Express'in kabul ettigi
# form govdesi (urlencoded) ve dizi bicimleri (q[]=, email[]=) de kapsanir.
# Not: tek tirnak operatorde \x27 olarak yazilir; ciplak ' ModSecurity
# ayristiricisinda soz dizimi hatasi veriyor.
# Not: ModSecurity v3, JSON govdesindeki alanlari ARGS'a koyar, ARGS_POST'a
# koymaz; bu yuzden SY-7 ARGS kullanir (esik 6 denemesinde JSON istegi
# ARGS_POST ile gecmisti).
# -----------------------------------------------------------------------------
SecRule REQUEST_FILENAME "@rx ^/rest/products/search/?$" \
    "id:10150,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    auditlog,\
    t:none,t:urlDecodeUni,t:normalizePath,t:lowercase,\
    msg:'Sanal yama SY-6 (V002): urun aramasinda tek tirnak',\
    logdata:'%{MATCHED_VAR_NAME}',\
    tag:'juice-shop/V002',\
    tag:'attack-sqli',\
    severity:'CRITICAL',\
    chain"
    SecRule ARGS_GET:/^q/ "@rx \x27" "t:none"

SecRule REQUEST_FILENAME "@rx ^/rest/user/login/?$" \
    "id:10160,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    auditlog,\
    t:none,t:urlDecodeUni,t:normalizePath,t:lowercase,\
    msg:'Sanal yama SY-7 (V001): giris e-postasinda tek tirnak',\
    logdata:'%{MATCHED_VAR_NAME}',\
    tag:'juice-shop/V001',\
    tag:'attack-sqli',\
    severity:'CRITICAL',\
    chain"
    SecRule ARGS:/email/ "@rx \x27" "t:none"
