# =============================================================================
# S3-K5: Juice Shop icin sanal yamalar (virtual patching)
#
# Container icinde su yola baglanir:
#   /etc/modsecurity.d/owasp-crs/rules/REQUEST-900-VIRTUAL-PATCHES-JUICESHOP.conf
# Imaj rules/*.conf dosyalarini alfabetik sirayla yukler; bu dosya istisna
# dosyasindan sonra, CRS kurallarindan once calisir.
#
# Istisna dosyasindan farki: istisnalar CRS'i GEVSETIR (yanlis pozitif),
# sanal yamalar CRS'in KACIRDIGI bilinen bir aciga ozel kural EKLER.
# Her yama envanterdeki bir zafiyete (Vxxx) baglidir ve
# docs/waf-engelleme-notu.md dosyasinda belgelenmistir.
#
# Kural ID araligi: 10100-10199
# =============================================================================


# -----------------------------------------------------------------------------
# SY-1  V003: Siparis takibi, yol icinde NoSQL enjeksiyonu
#
# /rest/track-order/:id  ->  MongoDB benzeri $where sorgusuna dogrudan girer:
#   db.ordersCollection.find({ $where: `this.orderId === '${id}'` })
# "' || true || '" gibi bir deger tum kullanicilarin siparislerini dondurur.
# CRS (PL1) bu yukleri yol icinde yakalamiyor (test: 200, 3 siparis sizdi).
#
# Pozitif model: sadece Juice Shop'un urettigi siparis numarasi bicimine izin
# verilir (routes/order.ts: hash(email).slice(0,4) + '-' + randomHex(16)):
#   ^/rest/track-order/[0-9a-f]{4}-[0-9a-f]{16}$
# Express yollari buyuk/kucuk harf ayirmaz; yol once %xx cozulur, // ve ./
# normalize edilir, kucuk harfe cevrilir. Boylece /REST/Track-Order/... veya
# //rest/track-order/... ile atlatilamaz.
# -----------------------------------------------------------------------------
SecRule REQUEST_FILENAME "@rx ^/rest/track-order/" \
    "id:10100,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    auditlog,\
    t:none,t:urlDecodeUni,t:normalizePath,t:lowercase,\
    msg:'Sanal yama SY-1 (V003): gecersiz siparis numarasi bicimi',\
    logdata:'%{MATCHED_VAR}',\
    tag:'juice-shop/V003',\
    tag:'attack-injection-nosql',\
    severity:'CRITICAL',\
    chain"
    SecRule REQUEST_FILENAME "!@rx ^/rest/track-order/[0-9a-f]{4}-[0-9a-f]{16}$" \
        "t:none,t:urlDecodeUni,t:normalizePath,t:lowercase"


# -----------------------------------------------------------------------------
# SY-2  V008: Kayit isteginde rol atama (mass assignment, "Admin Registration")
#
# POST /api/Users govdesi dogrudan Sequelize User modeline yazilir; govdeye
# "role":"admin" eklenirse kullanici yonetici olarak olusur. Uygulamanin kayit
# formu bu alani hic gondermez, bu yuzden kayit isteginde "role" adinda bir
# parametre gormek her durumda saldiridir.
#
# phase:2 (govde). CRS 901 JSON govdeler icin JSON islemcisini acar; JSON
# alanlari ARGS_NAMES'te "json.role" olarak gorunur. Form govdesi ("role=")
# ve ic ice alanlar ("json.x.role") da yakalanir. Yol SY-1'deki gibi normalize
# edilir (/API/Users, //api/users/ ile atlatilamaz).
# -----------------------------------------------------------------------------
SecRule REQUEST_METHOD "@streq POST" \
    "id:10110,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    auditlog,\
    msg:'Sanal yama SY-2 (V008): kayit isteginde rol alani',\
    logdata:'%{MATCHED_VAR_NAME}',\
    tag:'juice-shop/V008',\
    tag:'attack-mass-assignment',\
    severity:'CRITICAL',\
    chain"
    SecRule REQUEST_FILENAME "@rx ^/api/users/?$" \
        "t:none,t:urlDecodeUni,t:normalizePath,t:lowercase,\
        chain"
        SecRule ARGS_NAMES "@rx (?:^|\.)role$" \
            "t:none,t:lowercase"
