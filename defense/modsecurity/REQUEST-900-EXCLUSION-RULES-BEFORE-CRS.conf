# =============================================================================
# S3-K5: Juice Shop icin CRS istisnalari (engelleme modu, MODSEC_RULE_ENGINE=On)
#
# Container icinde su yola baglanir:
#   /etc/modsecurity.d/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf
# Bu dosya CRS kurallarindan ONCE yuklenir; bu yuzden "calisma zamani" (runtime)
# istisnalari burada tanimlanir. Her istisna:
#   - tek bir yol (REQUEST_FILENAME) ve tek bir metod/degisken ile sinirlidir,
#   - kuralin tamamini kapatmaz,
#   - docs/waf-engelleme-notu.md dosyasinda gerekcesiyle belgelenmistir.
#
# Kural ID araligi: 10000-10099 (yerel kurallar; CRS 900000-999999'u kullanir)
# =============================================================================


# -----------------------------------------------------------------------------
# I-1  Metod politikasi (CRS 911100 "Method is not allowed by policy")
#
# CRS varsayilan olarak sadece GET HEAD POST OPTIONS'a izin verir. Juice Shop'un
# Angular on yuzu asagidaki uc noktalarda PUT / PATCH / DELETE kullanir.
# Metodlari site genelinde acmak yerine sadece bu yollar icin tx.allowed_methods
# genisletilir. Liste on yuz kaynak kodundan cikarildi:
#   juice-shop v20.4.0 frontend/src/app/Services/*.service.ts
# Yeni bir surumde yeni bir uc nokta eklenirse 911100 403 dondurur; audit.log'a
# bakip regex'e eklemek yeterlidir.
# -----------------------------------------------------------------------------

# PUT
SecRule REQUEST_METHOD "@streq PUT" \
    "id:10010,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    msg:'Juice Shop: PUT sadece on yuzun kullandigi uc noktalarda serbest',\
    chain"
    SecRule REQUEST_FILENAME "@rx ^/(?:api/(?:BasketItems|Addresss|Hints|Products|Quantitys)/[0-9]+|rest/basket/[0-9]+/coupon/[^/]+|rest/products/[0-9]+/reviews|rest/wallet/balance|rest/order-history/[^/]+/delivery-status|rest/continue-code(?:-findIt|-fixIt)?/apply/[^/]+)$" \
        "t:none,\
        setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT'"

# DELETE
SecRule REQUEST_METHOD "@streq DELETE" \
    "id:10011,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    msg:'Juice Shop: DELETE sadece on yuzun kullandigi uc noktalarda serbest',\
    chain"
    SecRule REQUEST_FILENAME "@rx ^/(?:api/(?:BasketItems|Addresss|Cards|Feedbacks)/[0-9]+|rest/passkey/credentials/[^/]+)$" \
        "t:none,\
        setvar:'tx.allowed_methods=GET HEAD POST OPTIONS DELETE'"

# PATCH (yorum duzenleme)
SecRule REQUEST_METHOD "@streq PATCH" \
    "id:10012,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    msg:'Juice Shop: PATCH sadece yorum duzenlemede serbest',\
    chain"
    SecRule REQUEST_FILENAME "@streq /rest/products/reviews" \
        "t:none,\
        setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PATCH'"


# -----------------------------------------------------------------------------
# I-2  /rest/user/whoami (CRS 932260 "Direct Unix Command Execution")
#
# Uc noktanin adi "whoami" Unix komutuyla ayni oldugu icin 932260 istek yolunu
# (REQUEST_FILENAME) komut calistirma girisimi saniyor. On yuz bu uc noktayi her
# sayfa yuklemesinde cagirir; istisna olmadan giris yapmis her kullanici 403 alir.
# Sadece bu yol icin, sadece REQUEST_FILENAME hedefi 932260'tan cikarilir;
# ayni istegin parametreleri, basliklari ve cerezleri 932260 ile denetlenmeye
# devam eder.
# -----------------------------------------------------------------------------
SecRule REQUEST_FILENAME "@streq /rest/user/whoami" \
    "id:10020,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    msg:'Juice Shop: whoami uc nokta adi 932260 yanlis pozitifi',\
    ctl:ruleRemoveTargetById=932260;REQUEST_FILENAME"


# -----------------------------------------------------------------------------
# I-3  socket.io long-polling (CRS 920420 "Request content type is not allowed")
#
# Juice Shop on yuzu socket.io (Engine.IO v4) kullanir. Polling modunda tarayici
# /socket.io/ adresine "Content-Type: text/plain;charset=UTF-8" ile POST gonderir.
# CRS 4 izinli icerik turleri arasinda text/plain yoktur; istisna olmadan her
# sayfada surekli 403 olusur ve canli baglanti (bildirimler) kurulamaz.
# Sadece POST /socket.io/ icin izinli icerik turu listesi |text/plain| yapilir
# (yani bu yolda SADECE text/plain kabul edilir). Diger yollarda politika ayni.
#
# SINIRLAMA: text/plain govde ModSecurity tarafindan parametrelere ayrilmaz;
# CRS saldiri kurallari cogunlukla ARGS'a baktigi icin socket.io mesajlarinin
# ICERIGI fiilen DENETLENMEZ (test: XSS iceren govde 200 aldi). Istisna bunu
# yaratmiyor: istisnasiz 920420 icerige bakmadan her mesaji engelliyordu;
# WebSocket'e yukseltilen baglantiyi ise ModSecurity hic goremez.
# Denetlenmeye devam edenler: URL, query string (EIO, transport, t, sid),
# basliklar ve cerezler. Ayrinti: docs/waf-engelleme-notu.md, I-3.
# -----------------------------------------------------------------------------
SecRule REQUEST_METHOD "@streq POST" \
    "id:10030,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    msg:'Juice Shop: socket.io polling text/plain govdesi',\
    chain"
    SecRule REQUEST_FILENAME "@streq /socket.io/" \
        "t:none,\
        setvar:'tx.allowed_request_content_type=|text/plain|'"


# -----------------------------------------------------------------------------
# I-4  OIDC geri donusu (CRS 934110 "Possible SSRF ... URL in Parameter")
#
# S4-K5: Keycloak girisinden sonra tarayici /oauth2/callback adresine doner.
# OIDC standardi (RFC 9207) geri donuse "iss" parametresini ekler; degeri
# Keycloak'un kendi adresi: http://localhost:8081/realms/lab. 934110 bu
# parametredeki "http://localhost"u SSRF sanir (puan 5 = esik) ve her giris
# 403 ile biter (YP-4).
#
# Istisna dort kosulla sinirli: yol /oauth2/callback, parametre iss, tam
# olarak bir iss parametresi (iss=bizimki&iss=baska ile atlatilmasin) ve deger
# TAM OLARAK bizim issuer adresimiz. Baska bir deger (or. bulut metadata
# adresi) gelirse 934110 yine calisir. Ayni istegin diger parametreleri
# (code, state, session_state) butun kurallarla denetlenmeye devam eder.
# Keycloak adresi degisirse (KC_HOSTNAME) buradaki deger de degismeli.
# -----------------------------------------------------------------------------
SecRule REQUEST_FILENAME "@streq /oauth2/callback" \
    "id:10040,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    msg:'OIDC geri donusu: iss parametresi bizim Keycloak adresimiz',\
    chain"
    SecRule &ARGS:iss "@eq 1" \
        "t:none,\
        chain"
        SecRule ARGS_GET:iss "@streq http://localhost:8081/realms/lab" \
            "t:none,\
            ctl:ruleRemoveTargetById=934110;ARGS:iss"
